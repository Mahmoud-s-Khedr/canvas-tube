name: Build Fedora (Debug)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_rpm:
        description: 'Also package as Fedora RPM (.rpm)'
        required: false
        type: boolean
        default: false

jobs:
  build-fedora-debug:
    name: Build Fedora Debug Artifact & AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CanvasTube in Official Fedora 41 Container
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e CI=true -e NODE_ENV=development \
            -e BUILD_RPM="${{ github.event.inputs.build_rpm || 'false' }}" \
            fedora:41 bash -s <<'FEDORA'
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False nodejs npm git tar gzip rpm-build \
            gtk3 nss alsa-lib libX11 libXcomposite libXdamage libXrandr libxkbcommon \
            mesa-libgbm xorg-x11-server-Xvfb xorg-x11-xauth dbus-libs at-spi2-atk
          useradd --uid 1000 --create-home tester
          chown -R tester:tester /workspace
          runuser -u tester -- bash -s <<'TESTS'
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run test:coverage
          npm run lint
          npm run build
          xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e
          npx electron-builder --linux --dir --publish never
          xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:e2e:packaged -- --grep launch
          npx electron-builder --linux AppImage --publish never
          if [ "$BUILD_RPM" = "true" ]; then
            npx electron-builder --linux rpm --publish never
          fi
          cd dist
          tar -czf canvastube-fedora-debug-x64.tar.gz linux-unpacked/
          TESTS
          FEDORA

      - name: Upload Fedora Debug Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-fedora-debug-x64
          path: dist/canvastube-fedora-debug-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Fedora Coverage Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-fedora-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Fedora AppImage
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-fedora-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Fedora RPM (if requested)
        if: ${{ github.event.inputs.build_rpm == true || github.event.inputs.build_rpm == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-fedora-rpm
          path: dist/*.rpm
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Fedora Electron diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-fedora-electron-tests
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
