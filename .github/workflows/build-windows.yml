name: Build Windows (Win 10 & 11)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows 10/11 Executable & Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Compile application
        run: npm run build

      - name: Run compiled Electron smoke tests
        run: npm run test:e2e

      - name: Package Windows debug executable
        run: npx electron-builder --win --dir --publish never

      - name: Launch packaged Windows executable
        run: npm run test:e2e:packaged -- --grep launch

      - name: Package Windows portable and NSIS binaries
        run: npx electron-builder --win portable nsis --publish never

      - name: Upload Windows Portable Executable
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-windows-portable-x64
          path: dist/CanvasTube *.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Coverage Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-windows-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows NSIS Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-windows-setup-x64
          path: dist/CanvasTube Setup *.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Electron diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canvastube-windows-electron-tests
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
